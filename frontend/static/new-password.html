<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <title>New Password · Make Your Own Pizza</title>
  </head>
  <body>
    <div class="auth">
      <!-- Brand panel — hidden below 1024px -->
      <aside class="auth__brand">
        <span class="auth__glow auth__glow--primary" aria-hidden="true"></span>
        <span class="auth__glow auth__glow--gold" aria-hidden="true"></span>

        <span class="auth__logo">Make Your Own Pizza</span>

        <div class="auth__pitch">
          <p class="auth__pitch-title">
            A clean digital pizza studio.<br />
            Build yours, ingredient by ingredient.
          </p>
          <p class="auth__pitch-body">
            Real toppings, real-time pricing, and a pizza that looks exactly how
            you built it.
          </p>
        </div>
      </aside>

      <main class="auth__panel">
        <div class="auth__form-wrap">
          <h1 class="auth__title">Create a new password</h1>
          <p class="auth__subtitle">Choose something you'll remember.</p>

          <!-- FORM: submit the new password, then redirect to login.html -->
          <form class="stack stack--md mt-8" action="#" method="post">
            <label class="field">
              <span class="field__label">New password</span>
              <input class="input" type="password" name="password" required />
            </label>

            <label class="field">
              <span class="field__label">Confirm new password</span>
              <input class="input" type="password" name="confirm" required />
            </label>

            <!-- ERROR: "Use at least 8 characters." / "Passwords do not match." -->
            <p class="form-error" hidden>Passwords do not match.</p>

            <button class="btn btn--primary btn--lg mt-1" type="submit">
              Update Password
            </button>
          </form>
        </div>
      </main>
    </div>
  </body>
</html>
