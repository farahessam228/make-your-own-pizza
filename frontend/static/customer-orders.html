<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <title>My Orders · Make Your Own Pizza</title>
  </head>
  <body>
    <div class="page">
      <header class="app-header">
        <div class="container app-header__inner">
          <a class="app-header__brand" href="customer-builder.html">
            Make Your Own Pizza
          </a>
          <nav class="app-nav">
            <a class="app-nav__link" href="customer-builder.html">Build Pizza</a>
            <a class="app-nav__link is-active" href="customer-orders.html">My Orders</a>
            <a class="app-nav__link" href="customer-cart.html">Cart</a>
            <a class="app-nav__link" href="customer-settings.html">Profile</a>
          </nav>
        </div>
      </header>

      <main class="container app-main">
        <div class="page-header">
          <div>
            <p class="page-header__eyebrow">Orders</p>
            <h1 class="page-header__title">My orders</h1>
          </div>
        </div>

        <!-- TABS: mark the open tab with .is-active + aria-selected="true" -->
        <div class="tabs mt-6" role="tablist">
          <button class="tabs__tab is-active" role="tab" aria-selected="true" type="button">
            Active
          </button>
          <button class="tabs__tab" role="tab" aria-selected="false" type="button">
            Past Orders
          </button>
        </div>

        <!-- EMPTY STATE: when the filtered list is empty, use this instead —
          <div class="empty mt-6">
            <h3 class="empty__title">No orders yet</h3>
            <p class="empty__description">
              Once you create your first pizza, you'll find your orders here.
            </p>
            <a class="btn btn--primary empty__action" href="customer-builder.html">
              Build Your First Pizza
            </a>
          </div>
        -->

        <!-- TEMPLATE: repeat .order-card per order.
             Active orders link to tracking, past orders to the detail page. -->
        <div class="stack stack--sm mt-6">
          <article class="card order-card">
            <div>
              <p class="order-card__id">#1842</p>
              <p class="order-card__title">2 Pizzas</p>
              <p class="order-card__date">Aug 9 · 6:42 PM</p>
            </div>
            <div class="order-card__meta">
              <span class="order-card__total">EGP 390</span>
              <span class="badge badge--primary">On the Way</span>
            </div>
            <a class="btn btn--secondary btn--sm" href="customer-track.html">View Order</a>
          </article>

          <article class="card order-card">
            <div>
              <p class="order-card__id">#1863</p>
              <p class="order-card__title">1 Pizza</p>
              <p class="order-card__date">Aug 9 · 4:30 PM</p>
            </div>
            <div class="order-card__meta">
              <span class="order-card__total">EGP 158</span>
              <span class="badge badge--gold">Waiting for Delivery</span>
            </div>
            <a class="btn btn--secondary btn--sm" href="customer-track.html">View Order</a>
          </article>
        </div>

      </main>

      <!-- Mobile tab bar — hidden from 768px up -->
      <nav class="tabbar">
        <a class="tabbar__link" href="customer-builder.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 22 20H2L12 2Z M12 9v6 M9 13h6"/></svg>Build Pizza</a>
        <a class="tabbar__link is-active" href="customer-orders.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v4H4z M4 10h16v10H4z M9 14h6"/></svg>My Orders</a>
        <a class="tabbar__link" href="customer-cart.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.8h7.6a2 2 0 0 0 2-1.6L21 8H6"/></svg>Cart</a>
        <a class="tabbar__link" href="customer-settings.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z M4 20c1.6-4 5-6 8-6s6.4 2 8 6"/></svg>Profile</a>
      </nav>
    </div>
  </body>
</html>
