<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Forgot Password · Make Your Own Pizza</title>
  </head>
  <body>
    <div class="auth">
      <!-- Brand panel — hidden below 1024px -->
      <aside class="auth__brand">
        <span class="auth__glow auth__glow--primary" aria-hidden="true"></span>
        <span class="auth__glow auth__glow--gold" aria-hidden="true"></span>

        <span class="auth__logo">Make Your Own Pizza</span>

        <div class="auth__pitch">
          <p class="auth__pitch-title">
            A clean digital pizza studio.<br />
            Build yours, ingredient by ingredient.
          </p>
          <p class="auth__pitch-body">
            Real toppings, real-time pricing, and a pizza that looks exactly how
            you built it.
          </p>
        </div>
      </aside>

      <main class="auth__panel">
        <div class="auth__form-wrap">
          <h1 class="auth__title">Forgot your password?</h1>
          <p class="auth__subtitle">
            Enter the email on your account and we'll send a verification code.
          </p>

          <!-- FORM: request an OTP, then redirect to verify-otp.html -->
          <form class="stack stack--md mt-8" action="#" method="post">
            <label class="field">
              <span class="field__label">Email</span>
              <input class="input" type="email" name="email" required placeholder="you@example.com" />
            </label>

            <button class="btn btn--primary btn--lg mt-1" type="submit">
              Send Code
            </button>
          </form>

          <p class="auth__footnote">
            <a class="link" href="login.html">Back to sign in</a>
          </p>
        </div>
      </main>
    </div>
  </body>
</html>
